[package]
name = "awaaz"
version = "0.1.0"
edition = "2021"
description = "WhatsApp voice-note business assistant for Urdu, Punjabi, Pashto and Sindhi speakers"
license = "MIT"

[lib]
name = "awaaz"
path = "src/lib.rs"

[[bin]]
name = "awaaz"
path = "src/main.rs"

[dependencies]
# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (WhatsApp Cloud API, Whisper, Claude)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Database (runtime-checked queries, so no live DB is needed to compile)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"

# Webhook signature verification (HMAC-SHA256)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true